<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13111A">
<title>Rejoindre la visio par téléphone · X-Studio</title>
<meta property="og:title" content="Rejoindre la visio par téléphone">
<meta property="og:description" content="X-Studio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #13111A;
    --carte: #1D1A27;
    --bord: #302C3F;
    --texte: #FFFFFF;
    --doux: #B7B4C7;
    --discret: #8A879C;
    --fuchsia: #E91E8C;
    --succes: #10B981;
    --degrade-action: linear-gradient(to right, #5455FB, #B372CE, #FF4980);
    --degrade-titre: linear-gradient(to right, #7C3AED, #E91E8C);
  }
  * { box-sizing: border-box; }
  html { background: var(--fond); }
  body {
    margin: 0; min-height: 100svh; padding: 32px 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--fond); color: var(--texte);
    font-family: "Jost", system-ui, sans-serif; line-height: 1.5;
  }
  main { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  [hidden] { display: none !important; }
  section { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .logo { height: 28px; width: auto; margin-bottom: 40px; }
  h1 { font-size: 30px; font-weight: 600; line-height: 1.2; margin: 0 0 32px; }
  h1 span { display: block; background: var(--degrade-titre); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .action {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 18px 24px; border: 0; border-radius: 14px;
    background: var(--degrade-action); color: #fff; text-decoration: none;
    font: inherit; font-size: 19px; font-weight: 600; cursor: pointer;
    box-shadow: 0 10px 30px -10px rgba(233, 30, 140, .55);
    transition: transform .12s ease, filter .12s ease;
  }
  .action:active { transform: scale(.98); filter: brightness(.95); }
  .action svg { width: 22px; height: 22px; flex: none; }
  .secondaire {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 14px 20px; border-radius: 14px; margin-top: 12px;
    background: var(--carte); border: 1px solid var(--bord); color: var(--texte); text-decoration: none;
    font: inherit; font-size: 16px; font-weight: 500; cursor: pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .secondaire:hover { border-color: var(--doux); }
  .secondaire:active { transform: scale(.98); }
  .secondaire svg { width: 18px; height: 18px; flex: none; }

  .numero { margin: 12px 0 0; color: var(--discret); font-size: 14px; font-variant-numeric: tabular-nums; }
  .enregistrement { margin: 32px 0 0; display: flex; gap: 8px; align-items: center; color: var(--doux); font-size: 15px; }
  .enregistrement svg { width: 16px; height: 16px; flex: none; color: var(--fuchsia); }

  /* Fabrication d'un lien */
  textarea {
    width: 100%; min-height: 96px; padding: 14px 16px; border-radius: 14px; resize: vertical;
    background: var(--carte); border: 1px solid var(--bord); color: var(--texte);
    font: inherit; font-size: 16px; line-height: 1.4;
  }
  textarea::placeholder { color: var(--discret); }
  textarea:focus { outline: none; border-color: var(--fuchsia); }
  .lu { width: 100%; margin: 12px 0 20px; min-height: 24px; font-size: 15px; color: var(--doux); font-variant-numeric: tabular-nums; }
  .lu.erreur { color: var(--discret); }
  .lien { width: 100%; margin: 0 0 16px; padding: 12px 16px; border-radius: 12px; background: var(--carte);
          color: var(--discret); font-size: 13px; word-break: break-all; text-align: left; }
  .copie-ok { background: var(--succes); box-shadow: none; }
</style>
</head>
<body>
<main>
  <img class="logo" src="brand/logo.svg" alt="X-Studio">

  <!-- Ce que voit le client -->
  <section id="vue-appel" hidden>
    <h1>Rejoindre la visio <span>par téléphone</span></h1>
    <a class="action" id="bouton" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Appeler
    </a>
    <p class="numero" id="numero"></p>
    <p class="enregistrement">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      L'échange est enregistré et transcrit.
    </p>
  </section>

  <!-- Fabrication du lien, quand l'adresse ne porte ni numéro ni code -->
  <section id="vue-fabrique" hidden style="width:100%">
    <h1>Lien d'appel <span>pour une visio</span></h1>
    <textarea id="colle" placeholder="Participer par téléphone&#10;(FR) +33 1 87 40 41 05 CODE : 448 139 798#" autofocus></textarea>
    <p class="lu" id="lu"></p>
    <div id="sortie" hidden style="width:100%">
      <p class="lien" id="lien"></p>
      <button class="action" id="copier" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span id="copier-texte">Copier le lien</span>
      </button>
      <a class="secondaire" id="whatsapp" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>
        Envoyer sur WhatsApp
      </a>
      <a class="secondaire" id="apercu" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Voir la page du client
      </a>
    </div>
  </section>
</main>

<script>
  // Adresse de la page du client : /?n=33187404105&c=448139798
  // n : numéro international sans le + ; c : code de la réunion sans le #
  var q = new URLSearchParams(location.search);
  var n = (q.get("n") || "").replace(/[^0-9]/g, "");
  var c = (q.get("c") || "").replace(/[^0-9]/g, "");

  function numeroLisible(n) {
    if (n.indexOf("33") === 0 && n.length === 11) {
      return "+33 " + n[2] + " " + n.slice(3).replace(/(\d{2})(?=\d)/g, "$1 ");
    }
    return "+" + n;
  }
  function codeLisible(c) { return c.replace(/(\d{3})(?=\d)/g, "$1 "); }

  // Lit le numéro et le code dans le texte collé depuis Meet, en français ou en anglais :
  //   (FR) +33 1 87 40 41 05 CODE : 448 139 798#
  //   (US) +1 470-273-8423 PIN: 123 456 789#
  function lire(texte) {
    var t = texte.replace(/ /g, " ");
    var tel = t.match(/\+\s?\d[\d\s.\-()]{6,}\d/);
    var code = t.match(/(?:code|pin)\s*:?\s*([\d\s]{4,})#?/i);
    var numero = tel ? tel[0].replace(/[^0-9]/g, "") : "";
    if (numero.indexOf("330") === 0) numero = "33" + numero.slice(3); // +33 (0)1 ...
    return { n: numero, c: code ? code[1].replace(/[^0-9]/g, "") : "" };
  }

  function adresse(n, c) {
    return location.origin + location.pathname + "?n=" + n + "&c=" + c;
  }

  if (n && c) {
    document.getElementById("vue-appel").hidden = false;
    document.getElementById("bouton").href = "tel:+" + n + ",,," + c + "%23";
    document.getElementById("numero").textContent =
      numeroLisible(n) + " · code " + codeLisible(c) + " composé automatiquement";
  } else {
    document.title = "Lien d'appel · X-Studio";
    document.getElementById("vue-fabrique").hidden = false;
    var colle = document.getElementById("colle");
    var lu = document.getElementById("lu");
    var sortie = document.getElementById("sortie");
    var lienCourant = "";

    function majour() {
      var r = lire(colle.value);
      if (!colle.value.trim()) { lu.textContent = ""; lu.className = "lu"; sortie.hidden = true; return; }
      if (!r.n || !r.c) {
        lu.className = "lu erreur";
        lu.textContent = !r.n ? "Numéro introuvable" : "Code introuvable";
        sortie.hidden = true;
        return;
      }
      lu.className = "lu";
      lu.textContent = numeroLisible(r.n) + " · code " + codeLisible(r.c);
      lienCourant = adresse(r.n, r.c);
      document.getElementById("lien").textContent = lienCourant;
      document.getElementById("whatsapp").href = "https://wa.me/?text=" + encodeURIComponent(
        "Pour rejoindre la visio par téléphone, il suffit de cliquer ici : " + lienCourant);
      document.getElementById("apercu").href = lienCourant;
      sortie.hidden = false;
    }
    colle.addEventListener("input", majour);

    document.getElementById("copier").addEventListener("click", function () {
      var bouton = this, texte = document.getElementById("copier-texte");
      function fait() {
        texte.textContent = "Lien copié";
        bouton.classList.add("copie-ok");
        setTimeout(function () { texte.textContent = "Copier le lien"; bouton.classList.remove("copie-ok"); }, 1800);
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(lienCourant).then(fait, function () { window.prompt("Lien", lienCourant); });
      } else {
        window.prompt("Lien", lienCourant);
      }
    });
  }
</script>
</body>
</html>
